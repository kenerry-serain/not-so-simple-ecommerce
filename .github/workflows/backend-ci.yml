name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/services/**'
      - 'src/workers/**'
      - 'src/domains/**'
      - 'src/infrastructure/**'
      - 'NotSoSimpleEcommerce.sln'
  push:
    paths:
      - 'src/services/**'
      - 'src/workers/**'
      - 'src/domains/**'
      - 'src/infrastructure/**'
      - 'NotSoSimpleEcommerce.sln'

env:
  DOTNET_VERSION: '6.0.x'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.changes.outputs.main }}
      order: ${{ steps.changes.outputs.order }}
      identity-server: ${{ steps.changes.outputs.identity-server }}
      health-checker: ${{ steps.changes.outputs.health-checker }}
      notificator: ${{ steps.changes.outputs.notificator }}
      invoice-generator: ${{ steps.changes.outputs.invoice-generator }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE=${{ github.event.before }}
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            echo "main=true" >> "$GITHUB_OUTPUT"
            echo "order=true" >> "$GITHUB_OUTPUT"
            echo "identity-server=true" >> "$GITHUB_OUTPUT"
            echo "health-checker=true" >> "$GITHUB_OUTPUT"
            echo "notificator=true" >> "$GITHUB_OUTPUT"
            echo "invoice-generator=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD)

          shared_changed=false
          if echo "$CHANGED" | grep -qE '^src/(domains/NotSoSimpleEcommerce\.Shared|infrastructure/)/|^NotSoSimpleEcommerce\.sln'; then
            shared_changed=true
          fi

          # Main: src/services/Main + Main.Domain + Order.Domain + S3Handler + all shared
          if [ "$shared_changed" = true ] || echo "$CHANGED" | grep -qE '^src/(services/NotSoSimpleEcommerce\.Main/|domains/NotSoSimpleEcommerce\.Main\.Domain/|domains/NotSoSimpleEcommerce\.Order\.Domain/)'; then
            echo "main=true" >> "$GITHUB_OUTPUT"
          else
            echo "main=false" >> "$GITHUB_OUTPUT"
          fi

          # Order: src/services/Order + Main.Domain + Order.Domain + all shared
          if [ "$shared_changed" = true ] || echo "$CHANGED" | grep -qE '^src/(services/NotSoSimpleEcommerce\.Order/|domains/NotSoSimpleEcommerce\.Main\.Domain/|domains/NotSoSimpleEcommerce\.Order\.Domain/)'; then
            echo "order=true" >> "$GITHUB_OUTPUT"
          else
            echo "order=false" >> "$GITHUB_OUTPUT"
          fi

          # IdentityServer: src/services/IdentityServer + IdentityServer.Domain + all shared
          if [ "$shared_changed" = true ] || echo "$CHANGED" | grep -qE '^src/(services/NotSoSimpleEcommerce\.IdentityServer/|domains/NotSoSimpleEcommerce\.IdentityServer\.Domain/)'; then
            echo "identity-server=true" >> "$GITHUB_OUTPUT"
          else
            echo "identity-server=false" >> "$GITHUB_OUTPUT"
          fi

          # HealthChecker: src/services/HealthChecker only (no project references)
          if echo "$CHANGED" | grep -qE '^src/services/NotSoSimpleEcommerce\.HealthChecker/'; then
            echo "health-checker=true" >> "$GITHUB_OUTPUT"
          else
            echo "health-checker=false" >> "$GITHUB_OUTPUT"
          fi

          # Notificator: src/workers/Notificator + SesHandler + SqsHandler + Utils
          if [ "$shared_changed" = true ] || echo "$CHANGED" | grep -qE '^src/workers/NotSoSimpleEcommerce\.Notificator/'; then
            echo "notificator=true" >> "$GITHUB_OUTPUT"
          else
            echo "notificator=false" >> "$GITHUB_OUTPUT"
          fi

          # InvoiceGenerator: src/workers/InvoiceGenerator + Shared + SesHandler + SqsHandler + Utils
          if [ "$shared_changed" = true ] || echo "$CHANGED" | grep -qE '^src/workers/NotSoSimpleEcommerce\.InvoiceGenerator/'; then
            echo "invoice-generator=true" >> "$GITHUB_OUTPUT"
          else
            echo "invoice-generator=false" >> "$GITHUB_OUTPUT"
          fi

  main:
    name: Main Service
    needs: detect-changes
    if: needs.detect-changes.outputs.main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/services/NotSoSimpleEcommerce.Main/NotSoSimpleEcommerce.Main.csproj

      - name: Build
        run: dotnet build src/services/NotSoSimpleEcommerce.Main/NotSoSimpleEcommerce.Main.csproj --no-restore -c Release

      - name: Docker Build
        run: docker build -f src/services/NotSoSimpleEcommerce.Main/Dockerfile .

  order:
    name: Order Service
    needs: detect-changes
    if: needs.detect-changes.outputs.order == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/services/NotSoSimpleEcommerce.Order/NotSoSimpleEcommerce.Order.csproj

      - name: Build
        run: dotnet build src/services/NotSoSimpleEcommerce.Order/NotSoSimpleEcommerce.Order.csproj --no-restore -c Release

      - name: Docker Build
        run: docker build -f src/services/NotSoSimpleEcommerce.Order/Dockerfile .

  identity-server:
    name: Identity Server
    needs: detect-changes
    if: needs.detect-changes.outputs.identity-server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/services/NotSoSimpleEcommerce.IdentityServer/NotSoSimpleEcommerce.IdentityServer.csproj

      - name: Build
        run: dotnet build src/services/NotSoSimpleEcommerce.IdentityServer/NotSoSimpleEcommerce.IdentityServer.csproj --no-restore -c Release

      - name: Docker Build
        run: docker build -f src/services/NotSoSimpleEcommerce.IdentityServer/Dockerfile .

  health-checker:
    name: Health Checker
    needs: detect-changes
    if: needs.detect-changes.outputs.health-checker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/services/NotSoSimpleEcommerce.HealthChecker/NotSoSimpleEcommerce.HealthChecker.csproj

      - name: Build
        run: dotnet build src/services/NotSoSimpleEcommerce.HealthChecker/NotSoSimpleEcommerce.HealthChecker.csproj --no-restore -c Release

      - name: Docker Build
        run: docker build -f src/services/NotSoSimpleEcommerce.HealthChecker/Dockerfile .

  notificator:
    name: Notificator Worker
    needs: detect-changes
    if: needs.detect-changes.outputs.notificator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/workers/NotSoSimpleEcommerce.Notificator/NotSoSimpleEcommerce.Notificator.csproj

      - name: Build
        run: dotnet build src/workers/NotSoSimpleEcommerce.Notificator/NotSoSimpleEcommerce.Notificator.csproj --no-restore -c Release

      - name: Docker Build
        run: docker build -f src/workers/NotSoSimpleEcommerce.Notificator/Dockerfile .

  invoice-generator:
    name: Invoice Generator Worker
    needs: detect-changes
    if: needs.detect-changes.outputs.invoice-generator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/workers/NotSoSimpleEcommerce.InvoiceGenerator/NotSoSimpleEcommerce.InvoiceGenerator.csproj

      - name: Build
        run: dotnet build src/workers/NotSoSimpleEcommerce.InvoiceGenerator/NotSoSimpleEcommerce.InvoiceGenerator.csproj --no-restore -c Release

      - name: Docker Build
        run: docker build -f src/workers/NotSoSimpleEcommerce.InvoiceGenerator/Dockerfile .
