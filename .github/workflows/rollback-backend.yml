name: Rollback BackEnd

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Microservice to rollback'
        required: true
        type: choice
        options:
          - main
          - order
          - identity-server
          - health-checker
          - notificator
          - invoice-generator

permissions:
  contents: read

env:
  ECR_REGISTRY: 968225077300.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_REPO_PREFIX: nsse/production
  GITOPS_REPO: kenerry-serain/not-so-simple-ecommerce-gitops
  GITOPS_KUSTOMIZE_DIR: production

jobs:
  rollback:
    name: Rollback ${{ inputs.service }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          ref: main
          fetch-depth: 0

      - uses: imranismail/setup-kustomize@v2

      - name: Resolve previous tag from kustomization history
        id: target
        working-directory: ${{ env.GITOPS_KUSTOMIZE_DIR }}
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          IMAGE_NAME="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_REPO_PREFIX }}/${SERVICE}"

          CURRENT=$(awk -v img="$IMAGE_NAME" '
            $0 ~ "name: "img"$" { found=1; next }
            found && /newTag:/ { print $2; exit }
          ' kustomization.yml)
          echo "Current tag on gitops: ${CURRENT:-<none>}"

          PREV=$(git log -p -- kustomization.yml \
            | awk -v img="$IMAGE_NAME" '
                $0 ~ "name: "img"$" { found=1; next }
                found && /^\+.*newTag:/ { sub(/^\+ */,""); print $2; exit }
              ' \
            | grep -vx "${CURRENT}" \
            | head -1)

          if [ -z "$PREV" ]; then
            echo "No previous tag found in kustomization history for ${SERVICE}." >&2
            exit 1
          fi

          echo "Previous tag: $PREV"
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Set image back to previous tag
        working-directory: ${{ env.GITOPS_KUSTOMIZE_DIR }}
        env:
          SERVICE: ${{ inputs.service }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          kustomize edit set image \
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_REPO_PREFIX }}/${SERVICE}=*:${TAG}

      - name: Commit & push
        env:
          SERVICE: ${{ inputs.service }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git config user.email "ci-bot@nsse.dev"
          git config user.name "ci-bot"
          git add ${{ env.GITOPS_KUSTOMIZE_DIR }}/kustomization.yml
          if git diff --staged --quiet; then
            echo "Already on tag ${TAG}; nothing to do."
            exit 0
          fi
          git commit -m "ci(rollback): ${SERVICE} -> ${TAG}"
          git push
